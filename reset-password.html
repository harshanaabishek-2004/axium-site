<main>
<h1>Choose a new password</h1>
<div class="card" id="box">
<p id="msg" class="mut">Checking your reset link…</p>
<form id="f" style="display:none">
<p><label for="p1">New password</label><br><input id="p1" type="password" minlength="8" autocomplete="new-password" required style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px"></p>
<p><label for="p2">Repeat new password</label><br><input id="p2" type="password" minlength="8" autocomplete="new-password" required style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px"></p>
<p><button class="btn" id="go" type="submit" style="border:0;cursor:pointer;font-size:16px">Save new password</button></p>
<p class="mut">At least 8 characters.</p>
</form></div>
<script>
(function(){
var URL="https://qxzzrsvssgluujjjcavz.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4enpyc3Zzc2dsdXVqampjYXZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTEwMDUsImV4cCI6MjEwNzcyNzAwNX0.sgMoJZ9m4okjG131yWoy693e7PRnOSyh1r1Zmb2P-60";
var h=new URLSearchParams(location.hash.replace(/^#/,"")),tok=h.get("access_token"),err=h.get("error_description")||h.get("error");
var msg=document.getElementById("msg"),f=document.getElementById("f");
try{history.replaceState(null,"",location.pathname);}catch(e){}
if(!tok||h.get("type")!=="recovery"){
  msg.textContent=err?"This link has expired or was already used. Open the Axium app and tap Forgot password to get a new one.":"This page needs the link from your reset email. Open the Axium app and tap Forgot password.";
}else{ msg.style.display="none"; f.style.display="block"; }
f.addEventListener("submit",function(e){
  e.preventDefault();
  var a=document.getElementById("p1").value,b=document.getElementById("p2").value;
  msg.style.display="block";
  if(a.length<8){msg.textContent="Use at least 8 characters.";return;}
  if(a!==b){msg.textContent="The two passwords do not match.";return;}
  var go=document.getElementById("go");go.disabled=true;msg.textContent="Saving…";
  fetch(URL+"/auth/v1/user",{method:"PUT",headers:{"apikey":KEY,"Authorization":"Bearer "+tok,"Content-Type":"application/json"},body:JSON.stringify({password:a})})
  .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
  .then(function(x){
    if(x.ok){f.style.display="none";msg.innerHTML="<b>Your password is changed.</b> Go back to the Axium app and sign in with your new password.";}
    else{go.disabled=false;msg.textContent=(x.j&&(x.j.msg||x.j.message))||"Could not change the password. Request a new reset email and try again.";}
  }).catch(function(){go.disabled=false;msg.textContent="Could not reach the server. Check your connection and try again.";});
});
})();
</script>
